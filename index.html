.ov{position:fixed;inset:0;background:linear-gradient(#0000 25%,#000a 70%,#000d);pointer-events:none}
.calc{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;padding:0 14px 18px}
.disp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px 6px;font-weight:300;font-size:88px;line-height:1;white-space:nowrap;overflow:hidden;text-shadow:0 1px 6px #000}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{border:0;color:#fff;font:inherit;font-size:34px;aspect-ratio:1;border-radius:50%;background:#333d;touch-action:manipulation;cursor:pointer;transition:filter .1s,transform .1s;display:flex;align-items:center;justify-content:center}
button:active{filter:brightness(1.6);transform:scale(.96)}
button.f{background:#a5a5a5d0;color:#000;font-size:30px}
button.o{background:#ff9f0ae6;font-size:42px;transition:background .15s,color .15s}
button.o.act{background:#fff;color:#ff9f0a}
button.z{grid-column:span 2;aspect-ratio:auto;border-radius:60px;justify-content:flex-start;padding-left:9%}

<body>
<div class="ov"></div>
<div class="calc">
  <div class="disp" id="d">0</div>
  <div class="grid" id="g"></div>
</div>
<script>
const keys=[["AC","f"],["±","f"],["%","f"],["÷","o"],["7"],["8"],["9"],["×","o"],["4"],["5"],["6"],["−","o"],["1"],["2"],["3"],["+","o"],["0","z"],[".",""],["=","o"]];
const g=document.getElementById("g"),d=document.getElementById("d");
let cur="0",prev=null,op=null,fresh=false,last=null,err=false;
keys.forEach(([l,c])=>{const b=document.createElement("button");b.textContent=l;b.className=c||"";b.dataset.k=l;b.addEventListener("pointerdown",e=>{e.preventDefault();press(l)});g.appendChild(b)});
const calc=(a,o,b)=>o=="+"?a+b:o=="−"?a-b:o=="×"?a*b:b==0?NaN:a/b;
function fmt(s){if(err)return"Error";const neg=s[0]=="-",t=neg?s.slice(1):s,[i,f]=t.split(".");
let n=BigInt(i||"0").toLocaleString("en-US");return(neg?"-":"")+n+(f!==undefined?"."+f:"")}
function num(v){if(!isFinite(v)){err=true;return"0"}let s=parseFloat(v.toPrecision(9)).toString();if(/e/.test(s))s=v.toExponential(4);return s}
function show(){d.textContent=fmt(cur);const n=d.textContent.length;d.style.fontSize=(n<=6?88:n<=7?76:n<=8?66:n<=9?58:n<=11?48:40)+"px";
document.querySelector('[data-k="AC"]').textContent=(cur!=="0"&&!fresh)||err?"C":"AC";
g.querySelectorAll(".o").forEach(b=>b.classList.toggle("act",fresh&&b.dataset.k==op&&b.dataset.k!="="))}
function press(k){
if(err&&k!="AC"){return}
if(/^\d$/.test(k)){if(fresh){cur=k;fresh=false}else if(cur.replace(/[-.]/g,"").length<9)cur=cur=="0"?k:cur=="-0"?"-"+k:cur+k}
else if(k=="."){if(fresh){cur="0.";fresh=false}else if(!cur.includes("."))cur+="."}
else if(k=="AC"){if(d.dataset.c!=="x"&&(cur!=="0"&&!fresh)&&!err){cur="0"}else{cur="0";prev=null;op=null;last=null;err=false}fresh=false}
else if(k=="±"){cur=cur[0]=="-"?cur.slice(1):"-"+cur;if(fresh){fresh=false}}
else if(k=="%"){cur=num(parseFloat(cur)/100);fresh=true}
else if(k=="="){if(op!==null){const b=parseFloat(cur);last=[op,b];cur=num(calc(prev,op,b));op=null;prev=null}else if(last){cur=num(calc(parseFloat(cur),last[0],last[1]))}fresh=true}
else{if(op!==null&&!fresh){cur=num(calc(prev,op,parseFloat(cur)))}prev=parseFloat(cur);op=k;fresh=true;last=null}
show()}
document.addEventListener("keydown",e=>{const m={"*":"×","/":"÷","-":"−","Enter":"=","Escape":"AC","Backspace":"AC",",":"."};const k=m[e.key]||e.key;if(keys.some(x=>x[0]==k)){e.preventDefault();press(k)}});
show();
</script>
